"$schema" = 'https://starship.rs/config-schema.json'

# Rosé Pine Moon — "airy" two-line prompt.
#
# No backgrounds anywhere: all colour lives in the glyphs, so the prompt stays
# light against Ghostty's black-at-85% backdrop (see dotfiles/ghostty/config).
#
# Two rules hold the design together:
#   1. Line 2 is always exactly "❯ " — duration, exit code and everything else
#      stay on line 1, so typed commands always start at the same column.
#   2. Nothing renders when it has nothing to say. Clean repo → no git status.
#      Fast command → no timer. Success → no exit code.
#
#   󰀵 ~/dev/nixos-config   main !2 +1   22.14.0
#   ❯ nix flake update
#
#   󰀵 ~/dev/api-server   feat/auth ?3   3.12.1  󱎫 4.2s  ✘ 1
#   ❯

format = """
$os\
$directory\
$git_branch\
$git_state\
$git_status\
$nix_shell\
$c\
$golang\
$haskell\
$java\
$kotlin\
$nodejs\
$php\
$python\
$rust\
$conda\
$cmd_duration\
$status\
$line_break\
$character"""

palette = 'rose_pine_moon'

# ── Context ──────────────────────────────────────────────────────────────────

[os]
disabled = false
style = "fg:muted"
format = '[$symbol ]($style)'

[os.symbols]
Macos = "󰀵"
NixOS = ""
Linux = "󰌽"
Arch = "󰣇"
Debian = "󰣚"
Ubuntu = "󰕈"
Fedora = "󰣛"
Alpine = ""
Manjaro = ""
Windows = ""

# The repo root is bold iris, the path above it recedes to muted. This is what
# makes the project name pop without needing a separate module.
[directory]
style = "fg:foam"
before_repo_root_style = "fg:muted"
repo_root_style = "bold fg:iris"
truncate_to_repo = false
truncation_length = 5
truncation_symbol = "…/"
read_only = " "
read_only_style = "fg:love"
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

# No trailing spaces here — the old powerline format padded segments, this one
# doesn't, so a trailing space would leak into the path.
[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

# ── Git ──────────────────────────────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:rose"
format = '[$symbol $branch]($style) '

# Only renders mid-rebase / mid-merge / mid-bisect.
[git_state]
style = "bold fg:love"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# The outer (…) collapses the whole segment when the tree is clean, so an
# untouched repo shows nothing at all after the branch name.
[git_status]
style = "fg:gold"
format = '([$all_status$ahead_behind]($style))'
up_to_date = ''
conflicted = '[~$count ](fg:love)'
deleted    = '[✘$count ](fg:love)'
modified   = '[!$count ](fg:gold)'
staged     = '[+$count ](fg:foam)'
renamed    = '[»$count ](fg:rose)'
untracked  = '[?$count ](fg:subtle)'
stashed    = '[\$$count ](fg:iris)'
ahead      = '[⇡$count ](fg:pine)'
behind     = '[⇣$count ](fg:pine)'
diverged   = '[⇕⇡$ahead_count⇣$behind_count ](fg:pine)'

# ── Environment ──────────────────────────────────────────────────────────────

# heuristic = true is what detects `nix develop`, which doesn't set IN_NIX_SHELL.
[nix_shell]
symbol = ""
style = "fg:foam"
heuristic = true
impure_msg = '[impure](fg:gold)'
pure_msg = '[pure](fg:foam)'
unknown_msg = '[nix](fg:subtle)'
format = '[$symbol ]($style)$state[( \($name\))](fg:subtle) '

# ── Toolchains ───────────────────────────────────────────────────────────────
# One shape for all of them: icon in pine, version dimmed to subtle.

[c]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[golang]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[haskell]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[java]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[kotlin]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[nodejs]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[php]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[python]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle)[( \($virtualenv\))](fg:muted) '

[rust]
symbol = ""
style = "fg:pine"
version_format = "${raw}"
format = '[$symbol ]($style)[($version)](fg:subtle) '

[conda]
symbol = ""
style = "fg:pine"
ignore_base = false
format = '[$symbol ]($style)[$environment](fg:subtle) '

# ── Feedback ─────────────────────────────────────────────────────────────────

[cmd_duration]
min_time = 2000
style = "fg:muted"
format = '[󱎫 $duration]($style) '

# Off by default in starship; shows the exit code of a failed command.
[status]
disabled = false
style = "fg:love"
symbol = "✘"
success_symbol = ""
not_executable_symbol = "󰅚"
not_found_symbol = "󰍉"
sigint_symbol = "󰂭"
signal_symbol = "⚡"
map_symbol = true
format = '[$symbol $status]($style) '

[character]
success_symbol = '[❯](fg:iris)'
error_symbol = '[❯](fg:love)'
vimcmd_symbol = '[❮](fg:foam)'
vimcmd_visual_symbol = '[❮](fg:rose)'
vimcmd_replace_symbol = '[❮](fg:gold)'
vimcmd_replace_one_symbol = '[❮](fg:gold)'

# Clock is off by design — line 1 stays quiet. To bring it back either add
# `$time` to `format` above (before `$cmd_duration`), or right-align it with:
#     right_format = """$time"""
[time]
disabled = true
time_format = "%R"
style = "fg:muted"
format = '[ $time]($style) '

# ── Palette ──────────────────────────────────────────────────────────────────
# Canonical Rosé Pine Moon. https://rosepinetheme.com/palette/ingredients/

[palettes.rose_pine_moon]
base           = "#232136"
surface        = "#2a273f"
overlay        = "#393552"
muted          = "#6e6a86"
subtle         = "#908caa"
text           = "#e0def4"
love           = "#eb6f92"
gold           = "#f6c177"
rose           = "#ea9a97"
pine           = "#3e8fb0"
foam           = "#9ccfd8"
iris           = "#c4a7e7"
highlight_low  = "#2a283e"
highlight_med  = "#44415a"
highlight_high = "#56526e"
